name: Sync F-Droid & IzzyOnDroid

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Which repo to sync'
        required: false
        default: 'all'
        type: choice
        options: [all, fdroid, izzy]

jobs:
  sync:
    name: Sync app catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run sync
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_REPO: ${{ github.event.inputs.repo || 'all' }}
        run: node sync-fdroid.mjs
